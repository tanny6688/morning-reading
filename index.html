<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨读国学堂 - AI智能考官</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
        .container{width:100%;max-width:850px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden;display:flex;flex-direction:column;height:95vh;max-height:780px}
        .header{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
        .header .left{display:flex;align-items:center;gap:10px}
        .header .pet-display{font-size:36px}
        .header .info{text-align:left}
        .header .info h1{font-size:20px}
        .header .info .score{font-size:13px;opacity:0.9}
        .header .right{display:flex;gap:6px}
        .header .icon-btn{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,0.5);background:transparent;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .header .icon-btn:hover{background:rgba(255,255,255,0.2)}
        .header .icon-btn.active{background:#fff;color:#f5576c;border-color:#fff}
        .panel{display:none;padding:15px;background:#f8f9fa;border-bottom:1px solid #e0e0e0;max-height:350px;overflow-y:auto}
        .panel.show{display:block}
        .panel h3{font-size:14px;margin-bottom:10px;color:#333}
        .panel .close-btn{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:#999}
        .student-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
        .student-form input{padding:8px 12px;border:2px solid #ddd;border-radius:15px;font-size:14px;width:100px}
        .student-form button{padding:8px 14px;background:#667eea;color:#fff;border:none;border-radius:15px;font-size:13px;cursor:pointer}
        .student-list{display:flex;flex-wrap:wrap;gap:6px}
        .student-tag{padding:6px 14px;border-radius:18px;font-size:13px;cursor:pointer;border:2px solid #ddd;background:#fff;display:flex;align-items:center;gap:6px}
        .student-tag:hover{background:#f0f0f0}
        .student-tag.active{background:#667eea;color:#fff;border-color:#667eea}
        .student-tag .del-btn{margin-left:4px;font-size:14px;color:#999;cursor:pointer;line-height:1}
        .student-tag.active .del-btn{color:#fff}
        .grade-grid{display:flex;flex-wrap:wrap;gap:6px}
        .grade-btn{padding:6px 16px;border:2px solid #ddd;border-radius:20px;background:#fff;font-size:13px;cursor:pointer}
        .grade-btn.active{background:#667eea;color:#fff;border-color:#667eea}
        .poem-grid{display:flex;flex-wrap:wrap;gap:5px}
        .poem-tag{padding:4px 10px;border-radius:12px;font-size:12px;cursor:pointer}
        .poem-tag.mastered{background:#c8f7c5;color:#2d7d2d}
        .poem-tag.learning{background:#fff3cd;color:#856404}
        .poem-tag.new{background:#e0e0e0;color:#999}
        .pet-evolution{display:flex;gap:15px;text-align:center;flex-wrap:wrap}
        .pet-stage{padding:10px;border-radius:10px;background:#fff;min-width:70px}
        .pet-stage.current{border:3px solid #f5576c;background:#fff5f5}
        .pet-stage .emoji{font-size:40px}
        .pet-stage .name{font-size:12px;margin-top:5px}
        .pet-stage .range{font-size:11px;color:#999}
        .chat-area{flex:1;overflow-y:auto;padding:15px;background:#f8f9fa}
        .message{margin-bottom:10px;display:flex;align-items:flex-start}
        .message.user{justify-content:flex-end}
        .message .bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
        .message.ai .bubble{background:#fff;border:1px solid #e0e0e0;border-bottom-left-radius:4px}
        .message.user .bubble{background:#667eea;color:#fff;border-bottom-right-radius:4px}
        .message .avatar{width:32px;height:32px;border-radius:50%;margin:0 8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
        .message.ai .avatar{background:#f5576c}
        .message.user .avatar{background:#667eea}
        .input-area{padding:12px 15px;background:#fff;border-top:1px solid #e0e0e0;display:flex;gap:8px;align-items:center}
        .input-area input{flex:1;padding:10px 15px;border:2px solid #e0e0e0;border-radius:20px;font-size:14px;outline:none}
        .input-area input:focus{border-color:#667eea}
        .input-area button{padding:10px 18px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer;white-space:nowrap}
        .input-area button:disabled{opacity:0.5;cursor:not-allowed}
        .voice-btn{width:40px;height:40px;border-radius:50%;border:none;background:#f5576c;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
        .voice-btn.listening{background:red;animation:pulse 0.8s infinite}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}70%{box-shadow:0 0 0 12px rgba(255,0,0,0)}100%{box-shadow:0 0 0 0 rgba(255,0,0,0)}}
        .voice-status{font-size:11px;color:#999;text-align:center;padding:2px}
        .typing-indicator{display:flex;gap:4px;padding:10px 14px}
        .typing-indicator span{width:7px;height:7px;background:#999;border-radius:50%;animation:typing 1.2s infinite}
        .typing-indicator span:nth-child(2){animation-delay:0.2s}
        .typing-indicator span:nth-child(3){animation-delay:0.4s}
        @keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
        .teacher-table{width:100%;border-collapse:collapse;font-size:13px}
        .teacher-table th,.teacher-table td{padding:8px;border:1px solid #ddd;text-align:center}
        .teacher-table th{background:#667eea;color:#fff}
        .teacher-table tr:nth-child(even){background:#f9f9f9}
        .teacher-table tr:hover{background:#f0f0f0}
        .teacher-summary{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:10px}
        .summary-card{padding:10px 15px;background:#fff;border-radius:10px;text-align:center;min-width:80px}
        .summary-card .num{font-size:24px;font-weight:bold;color:#667eea}
        .summary-card .label{font-size:11px;color:#999}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="left">
                <div class="pet-display" id="petEmoji">🥚</div>
                <div class="info">
                    <h1>📖 晨读国学堂</h1>
                    <div class="score">灵气值：<span id="scoreDisplay">0</span> | <span id="studentDisplay">未选择学号</span></div>
                </div>
            </div>
            <div class="right">
                <button class="icon-btn" onclick="togglePanel('grade')" title="部编版年级">📚</button>
                <button class="icon-btn" onclick="togglePanel('poem75')" title="75首古诗">📋</button>
                <button class="icon-btn" onclick="togglePanel('student')" title="学号管理">👤</button>
                <button class="icon-btn" onclick="togglePanel('pet')" title="宠物">🐾</button>
                <button class="icon-btn" id="speakBtn" onclick="toggleSpeak()" title="语音播报">🔊</button>
                <button class="icon-btn" onclick="togglePanel('teacher')" title="老师查看">🔑</button>
            </div>
        </div>
        <div class="panel" id="gradePanel">
            <h3>📚 部编版语文年级选择<button class="close-btn" onclick="closePanel('grade')">✕</button></h3>
            <div class="grade-grid">
                <button class="grade-btn" onclick="selectGrade(1,this)">一年级</button>
                <button class="grade-btn" onclick="selectGrade(2,this)">二年级</button>
                <button class="grade-btn" onclick="selectGrade(3,this)">三年级</button>
                <button class="grade-btn" onclick="selectGrade(4,this)">四年级</button>
                <button class="grade-btn" onclick="selectGrade(5,this)">五年级</button>
                <button class="grade-btn" onclick="selectGrade(6,this)">六年级</button>
                <button class="grade-btn" onclick="selectGrade(0,this)">全部75首</button>
            </div>
        </div>
        <div class="panel" id="poem75Panel">
            <h3>📋 75首必备古诗<button class="close-btn" onclick="closePanel('poem75')">✕</button></h3>
            <div class="poem-grid" id="poemList"></div>
        </div>
        <div class="panel" id="studentPanel">
            <h3>👤 学号管理（最多70人）<button class="close-btn" onclick="closePanel('student')">✕</button></h3>
            <div class="student-form">
                <input type="text" id="studentIdInput" placeholder="学号" />
                <input type="text" id="studentNameInput" placeholder="姓名" />
                <button onclick="addStudent()">➕ 添加</button>
                <button onclick="clearAllStudents()" style="background:#f5576c">清空全部</button>
            </div>
            <div class="student-list" id="studentList"></div>
        </div>
        <div class="panel" id="petPanel">
            <h3>🐾 灵兽进化<button class="close-btn" onclick="closePanel('pet')">✕</button></h3>
            <div class="pet-evolution" id="petEvolution"></div>
        </div>
        <div class="panel" id="teacherPanel">
            <h3>🔑 班级背诵情况总览<button class="close-btn" onclick="closePanel('teacher')">✕</button></h3>
            <div class="teacher-summary" id="teacherSummary"></div>
            <table class="teacher-table">
                <thead>
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>积分</th>
                        <th>灵兽</th>
                        <th>熟练首数</th>
                        <th>学习中</th>
                        <th>未背诵</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody"></tbody>
            </table>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="message ai">
                <div class="avatar">👨‍🏫</div>
                <div class="bubble">欢迎！请先点击 <strong>👤学号</strong> 添加学生，点击 <strong>📚年级</strong> 选择年级，然后选择学号开始晨读。<br>老师请点击 <strong>🔑</strong> 查看班级情况。</div>
            </div>
        </div>
        <div class="input-area">
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
            <input type="text" id="userInput" placeholder="语音报学号或输入背诵内容..." onkeypress="if(event.key==='Enter')sendMessage()" />
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
        <div class="voice-status" id="voiceStatus">添加学号 → 选择年级 → 开始背诵</div>
    </div>
    <script>
        var API_KEY='sk-9bd6a5c6d2904e10b4cc23ba4e92042c';
        var APP_ID='9dfa2bcee479439fbdd29ae3a252de76';
        var currentScore=parseInt(localStorage.getItem('score')||'0');
        var studentId=localStorage.getItem('studentId')||'';
        var studentName=localStorage.getItem('studentName')||'';
        var selectedGrade=parseInt(localStorage.getItem('grade')||'0');
        var speakEnabled=localStorage.getItem('speak')!=='false';
        var isWaiting=false;
        var isListening=false;
        var recognition=null;
        var studentList=JSON.parse(localStorage.getItem('studentList')||'[]');
        var allPoems=['咏鹅','春晓','静夜思','登鹳雀楼','望庐山瀑布','悯农','古朗月行','风','画','赠汪伦','寻隐者不遇','池上','小池','画鸡','梅花','小儿垂钓','江雪','夜宿山寺','敕勒歌','村居','咏柳','赋得古原草送别','晓出净慈寺送林子方','绝句','悯农','舟夜书所见','所见','山行','赠刘景文','夜书所见','望天门山','饮湖上初晴后雨','望洞庭','早发白帝城','采莲曲','绝句','惠崇春江晚景','三衢道中','忆江南','元日','清明','九月九日忆山东兄弟','滁州西涧','大林寺桃花','浪淘沙','鹿柴','暮江吟','题西林壁','雪梅','嫦娥','出塞','凉州词','夏日绝句','四时田园杂兴','宿新市徐公店','清平乐·村居','芙蓉楼送辛渐','塞下曲','墨梅','蝉','乞巧','示儿','题临安邸','己亥杂诗','山居秋暝','枫桥夜泊','长相思','渔歌子','游子吟','鸟鸣涧','从军行','闻官军收河南河北','黄鹤楼送孟浩然之广陵','宿建德江','西江月·夜行黄沙道中','江南春','书湖阴先生壁','寒食','迢迢牵牛星','十五夜望月','马诗','石灰吟','竹石','春夜喜雨','泊船瓜洲','游园不值','江畔独步寻花','早春呈水部张十八员外','江上渔者','浣溪沙','清平乐'];
        var masteredPoems=JSON.parse(localStorage.getItem('mastered')||'[]');
        var learningPoems=JSON.parse(localStorage.getItem('learning')||'[]');
        var studentScores=JSON.parse(localStorage.getItem('studentScores')||'{}');
        var studentMastered=JSON.parse(localStorage.getItem('studentMastered')||'{}');
        
        function init(){updatePetDisplay();updateStudentDisplay();updateSpeakBtn();renderPoemList();renderPetEvolution();highlightGradeBtn();renderStudentList();}
        function updatePetDisplay(){var s=currentScore;document.getElementById('scoreDisplay').textContent=s;if(s>=100)document.getElementById('petEmoji').textContent='🦄';else if(s>=50)document.getElementById('petEmoji').textContent='🐶';else if(s>=20)document.getElementById('petEmoji').textContent='🐣';else document.getElementById('petEmoji').textContent='🥚';}
        function updateStudentDisplay(){var d='未选择学号';if(studentId){d='学号：'+studentId;if(studentName)d+=' ('+studentName+')';}document.getElementById('studentDisplay').textContent=d;}
        function updateSpeakBtn(){var b=document.getElementById('speakBtn');if(speakEnabled){b.textContent='🔊';b.classList.remove('active');}else{b.textContent='🔇';b.classList.add('active');}}
        function togglePanel(name){var panel=document.getElementById(name+'Panel');var all=document.querySelectorAll('.panel');all.forEach(function(p){if(p!==panel)p.classList.remove('show');});panel.classList.toggle('show');if(name==='poem75')renderPoemList();if(name==='pet')renderPetEvolution();if(name==='student')renderStudentList();if(name==='teacher')renderTeacherPanel();}
        function closePanel(name){document.getElementById(name+'Panel').classList.remove('show');}
        
        function selectGrade(g,btn){
            selectedGrade=g;localStorage.setItem('grade',g);
            document.querySelectorAll('.grade-btn').forEach(function(b){b.classList.remove('active');});
            btn.classList.add('active');
            document.getElementById('voiceStatus').textContent='已选'+(g===0?'全部75首':g+'年级')+' | 选择学号开始背诵';
            closePanel('grade');
        }
        
        function highlightGradeBtn(){
            if(selectedGrade===0)return;
            var btns=document.querySelectorAll('.grade-btn');
            if(btns.length>=selectedGrade)btns[selectedGrade-1].classList.add('active');
        }
        
        function addStudent(){
            var id=document.getElementById('studentIdInput').value.trim();
            var name=document.getElementById('studentNameInput').value.trim();
            if(!id){alert('请输入学号');return;}
            if(studentList.length>=70){alert('最多添加70个学生');return;}
            var exists=studentList.find(function(s){return s.id===id;});
            if(exists){alert('该学号已存在');return;}
            studentList.push({id:id,name:name||''});
            studentList.sort(function(a,b){return parseInt(a.id)-parseInt(b.id);});
            localStorage.setItem('studentList',JSON.stringify(studentList));
            if(!studentScores[id]){studentScores[id]=0;localStorage.setItem('studentScores',JSON.stringify(studentScores));}
            if(!studentMastered[id]){studentMastered[id]=[];localStorage.setItem('studentMastered',JSON.stringify(studentMastered));}
            document.getElementById('studentIdInput').value='';
            document.getElementById('studentNameInput').value='';
            renderStudentList();
        }
        
        function selectStudent(id,name){
            studentId=id;studentName=name;
            localStorage.setItem('studentId',id);
            localStorage.setItem('studentName',name);
            currentScore=studentScores[id]||0;
            masteredPoems=studentMastered[id]||[];
            updatePetDisplay();
            updateStudentDisplay();
            renderStudentList();
            renderPoemList();
            document.getElementById('voiceStatus').textContent='已选学号：'+id+(name?' ('+name+')':'')+' | 开始背诵';
        }
        
        function deleteStudent(id,event){
            event.stopPropagation();
            studentList=studentList.filter(function(s){return s.id!==id;});
            localStorage.setItem('studentList',JSON.stringify(studentList));
            delete studentScores[id];localStorage.setItem('studentScores',JSON.stringify(studentScores));
            delete studentMastered[id];localStorage.setItem('studentMastered',JSON.stringify(studentMastered));
            if(studentId===id){studentId='';studentName='';currentScore=0;masteredPoems=[];updatePetDisplay();updateStudentDisplay();renderPoemList();}
            renderStudentList();
        }
        
        function clearAllStudents(){
            if(confirm('确定清空全部学号和数据？')){
                studentList=[];studentScores={};studentMastered={};
                localStorage.setItem('studentList','[]');
                localStorage.setItem('studentScores','{}');
                localStorage.setItem('studentMastered','{}');
                studentId='';studentName='';currentScore=0;masteredPoems=[];
                updatePetDisplay();updateStudentDisplay();renderPoemList();renderStudentList();
            }
        }
        
        function renderStudentList(){
            var container=document.getElementById('studentList');
            container.innerHTML='';
            studentList.forEach(function(s){
                var tag=document.createElement('span');
                tag.className='student-tag';
                if(s.id===studentId)tag.classList.add('active');
                tag.textContent=s.id+(s.name?' '+s.name:'');
                tag.onclick=function(){selectStudent(s.id,s.name);};
                var del=document.createElement('span');
                del.className='del-btn';
                del.textContent='✕';
                del.onclick=function(e){deleteStudent(s.id,e);};
                tag.appendChild(del);
                container.appendChild(tag);
            });
        }
        
        function renderTeacherPanel(){
            var summary=document.getElementById('teacherSummary');
            var total=studentList.length;
            var totalMastered=0;
            var totalScore=0;
            studentList.forEach(function(s){
                totalScore+=(studentScores[s.id]||0);
                totalMastered+=(studentMastered[s.id]||[]).length;
            });
            summary.innerHTML='<div class="summary-card"><div class="num">'+total+'</div><div class="label">学生总数</div></div>'+
                '<div class="summary-card"><div class="num">'+totalScore+'</div><div class="label">总积分</div></div>'+
                '<div class="summary-card"><div class="num">'+totalMastered+'</div><div class="label">熟练古诗</div></div>'+
                '<div class="summary-card"><div class="num">'+(total>0?Math.round(totalMastered/total):0)+'</div><div class="label">人均熟练</div></div>';
            
            var tbody=document.getElementById('teacherTableBody');
            tbody.innerHTML='';
            studentList.forEach(function(s){
                var score=studentScores[s.id]||0;
                var mastered=studentMastered[s.id]||[];
                var pet='🥚';
                if(score>=100)pet='🦄';
                else if(score>=50)pet='🐶';
                else if(score>=20)pet='🐣';
                var tr=document.createElement('tr');
                tr.innerHTML='<td>'+s.id+'</td><td>'+(s.name||'-')+'</td><td>'+score+'</td><td>'+pet+'</td><td>'+mastered.length+'</td><td>0</td><td>'+(75-mastered.length)+'</td>';
                tbody.appendChild(tr);
            });
        }
        
        function toggleSpeak(){
            speakEnabled=!speakEnabled;
            localStorage.setItem('speak',speakEnabled?'true':'false');
            updateSpeakBtn();
        }
        
        function renderPoemList(){
            var container=document.getElementById('poemList');
            container.innerHTML='';
            allPoems.forEach(function(poem){
                var tag=document.createElement('span');
                tag.className='poem-tag';
                tag.textContent=poem;
                if(masteredPoems.indexOf(poem)>-1)tag.classList.add('mastered');
                else if(learningPoems.indexOf(poem)>-1)tag.classList.add('learning');
                else tag.classList.add('new');
                container.appendChild(tag);
            });
        }
        
        function renderPetEvolution(){
            var container=document.getElementById('petEvolution');
            var stages=[{emoji:'🥚',name:'灵兽蛋',range:'0-19分',score:0},{emoji:'🐣',name:'幼年期',range:'20-49分',score:20},{emoji:'🐶',name:'成长期',range:'50-99分',score:50},{emoji:'🦄',name:'完全体',range:'100分+',score:100}];
            container.innerHTML='';
            stages.forEach(function(stage){
                var div=document.createElement('div');
                div.className='pet-stage';
                if(currentScore>=stage.score)div.classList.add('current');
                div.innerHTML='<div class="emoji">'+stage.emoji+'</div><div class="name">'+stage.name+'</div><div class="range">'+stage.range+'</div>';
                container.appendChild(div);
            });
        }
        
        function speakText(text){
            if(!speakEnabled)return;
            window.speechSynthesis.cancel();
            var t=text.replace(/<[^>]*>/g,'').replace(/\*\*/g,'').trim();
            if(!t)return;
            var u=new SpeechSynthesisUtterance(t);
            u.lang='zh-CN';u.rate=1.4;u.pitch=1.0;u.volume=1.0;
            window.speechSynthesis.speak(u);
        }
        
        function initSpeechRecognition(){
            var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
            if(!SR){document.getElementById('voiceBtn').style.display='none';return null;}
            var r=new SR();
            r.lang='zh-CN';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
            r.onstart=function(){
                isListening=true;
                document.getElementById('voiceBtn').classList.add('listening');
                document.getElementById('voiceBtn').textContent='🔴';
                document.getElementById('voiceStatus').textContent='正在聆听...请背诵';
            };
            r.onresult=function(e){
                var f='';
                for(var i=e.resultIndex;i<e.results.length;i++){f+=e.results[i][0].transcript;}
                document.getElementById('userInput').value=f;
                autoDetectStudent(f);
            };
            r.onerror=function(e){document.getElementById('voiceStatus').textContent='识别出错: '+e.error;stopListening();};
            r.onend=function(){
                var input=document.getElementById('userInput');
                var hasText=input.value.trim();
                stopListening();
                if(hasText)setTimeout(function(){sendMessage();},500);
            };
            return r;
        }
        
        function autoDetectStudent(text){
            var patterns=[/我是\s*(\d+)\s*号/,/(\d+)\s*号/,/学号\s*(\d+)/,/^(\d+)$/];
            for(var i=0;i<patterns.length;i++){
                var m=text.match(patterns[i]);
                if(m){
                    var id=m[1];
                    var found=studentList.find(function(s){return s.id===id;});
                    if(found)selectStudent(found.id,found.name);
                    break;
                }
            }
        }
        
        function toggleVoice(){if(isListening)stopListening();else startListening();}
        function startListening(){
            if(!recognition)recognition=initSpeechRecognition();
            if(recognition){document.getElementById('userInput').value='';recognition.start();}
        }
        function stopListening(){
            isListening=false;
            document.getElementById('voiceBtn').classList.remove('listening');
            document.getElementById('voiceBtn').textContent='🎤';
            document.getElementById('voiceStatus').textContent='已选'+(selectedGrade===0?'全部75首':selectedGrade+'年级')+' | 选择学号开始背诵';
            if(recognition)try{recognition.stop();}catch(e){}
        }
        
        function addMessage(role,content){
            var c=document.getElementById('chatArea');
            var d=document.createElement('div');
            d.className='message '+role;
            var a=role==='ai'?'👨‍🏫':'🧑‍🎓';
            d.innerHTML='<div class="avatar">'+a+'</div><div class="bubble">'+content.replace(/\n/g,'<br>')+'</div>';
            c.appendChild(d);c.scrollTop=c.scrollHeight;
            if(role==='ai')setTimeout(function(){speakText(content);},200);
        }
        
        function addTypingIndicator(){
            var c=document.getElementById('chatArea');
            var d=document.createElement('div');
            d.className='message ai';d.id='typingIndicator';
            d.innerHTML='<div class="avatar">👨‍🏫</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
            c.appendChild(d);c.scrollTop=c.scrollHeight;
        }
        function removeTypingIndicator(){
            var i=document.getElementById('typingIndicator');
            if(i)i.remove();
        }
        function extractScore(reply){
            var m=reply.match(/灵气值[：:]\s*(\d+)/);
            if(m)return parseInt(m[1]);
            return null;
        }
        
        async function callBailianAPI(msg){
            var fullMsg=msg;
            if(studentId){
                fullMsg='[学号:'+studentId+(studentName?' 姓名:'+studentName:'')+' 年级：'+(selectedGrade===0?'全部75首':selectedGrade+'年级')+'] '+msg;
            }
            var url='https://dashscope.aliyuncs.com/api/v1/apps/'+APP_ID+'/completion';
            var res=await fetch(url,{
                method:'POST',
                headers:{'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'},
                body:JSON.stringify({input:{session_id:'s'+studentId,prompt:fullMsg},parameters:{}})
            });
            if(!res.ok)throw new Error('API错误:'+res.status);
            var data=await res.json();
            if(data.output&&data.output.text)return data.output.text;
            if(data.output&&data.output.choices&&data.output.choices.length>0)return data.output.choices[0].message.content;
            if(data.text)return data.text;
            throw new Error('解析失败');
        }
        
        async function sendMessage(){
            if(isWaiting)return;
            var input=document.getElementById('userInput');
            var btn=document.getElementById('sendBtn');
            var msg=input.value.trim();
            if(!msg)return;
            if(isListening)stopListening();
            autoDetectStudent(msg);
            addMessage('user',msg);
            input.value='';
            isWaiting=true;btn.disabled=true;
            addTypingIndicator();
            try{
                var reply=await callBailianAPI(msg);
                removeTypingIndicator();
                addMessage('ai',reply);
                var s=extractScore(reply);
                if(s!==null){
                    currentScore=s;
                    localStorage.setItem('score',s);
                    if(studentId){
                        studentScores[studentId]=s;
                        localStorage.setItem('studentScores',JSON.stringify(studentScores));
                    }
                    updatePetDisplay();
                }
            }catch(e){
                removeTypingIndicator();
                addMessage('ai','抱歉，请稍后再试~');
            }
            isWaiting=false;btn.disabled=false;input.focus();
        }
        
        document.addEventListener('DOMContentLoaded',function(){init();});
    </script>
</body>
</html>
